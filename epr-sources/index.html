  const pw=new TextEncoder().encode(document.getElementById("pw").value);
  const km=await crypto.subtle.importKey("raw",pw,"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:un(SALT),iterations:ITER,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:un(IV)},key,un(CT));
  document.open();document.write(new TextDecoder().decode(pt));document.close();
 }catch(_){
  err.textContent="Wrong password, try again.";
  btn.disabled=false;btn.textContent="Open";
 }
});
</script></body></html>
