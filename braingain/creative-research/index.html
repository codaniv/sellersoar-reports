<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>BrainGain Creative Research | SellerSoar</title><style>body{margin:0;background:#f6f5fc;color:#191919;font:16px/1.5 Arial}#gate{max-width:420px;margin:12vh auto;padding:32px;background:white;border:1px solid #ddd7ea;border-radius:14px}h1{font-size:27px}label,input,button{display:block;width:100%;box-sizing:border-box}input,button{padding:13px;margin-top:10px;font:inherit;border-radius:7px;border:1px solid #d6d5de}button{background:#4d389b;color:white;cursor:pointer}#error{color:#923731}#bar{display:none;padding:8px 16px;gap:14px;align-items:center;background:white;border-bottom:1px solid #ddd}#bar button{width:auto;margin:0;padding:6px 14px;font-size:14px}iframe{display:none;width:100%;height:calc(100dvh - 53px);border:0}body.unlocked{height:100dvh;display:flex;flex-direction:column;overflow:hidden}#bar{flex-wrap:wrap;flex-shrink:0}#bar #location{display:none}#phase-nav,#phase-subnav{display:flex;gap:8px;flex-wrap:wrap;padding:8px 16px;background:#fff}#phase-nav button,#phase-subnav button{width:auto;margin:0;padding:9px 16px;background:#eeebfa;color:#4d389b;border:1px solid #d6d5de}#phase-nav button[aria-current="step"]{background:#4d389b;color:white}#phase-subnav button{font-size:13px;background:white}#phase-subnav button[aria-current="page"]{background:#eeebfa;border-color:#7565ea}#flow{display:none;flex-shrink:0;border-bottom:1px solid #d6d5de}body.unlocked #viewer{flex:1;min-height:0;height:auto}@media(max-width:600px){#phase-nav{display:grid;grid-template-columns:1fr 1fr}#phase-nav button{font-size:14px;padding:8px}#phase-subnav{gap:5px;padding:6px 12px}#phase-subnav button{padding:6px 9px}}</style></head><body><main id="gate"><small>SELLERSOAR · CLIENT REPORTS</small><h1>BrainGain<br>Creative research</h1><p>Private client presentation. Enter the password supplied for this creative report.</p><form id="unlock"><label for="password">Password</label><input id="password" type="password" required autocomplete="current-password"><button id="submit">Open report</button><p id="error" role="status"></p></form></main><nav id="bar"><button id="home">Research report</button><button id="lock">Lock report</button><span id="location"></span></nav><div id="flow"><nav id="phase-nav" aria-label="Review phases"></nav><nav id="phase-subnav" aria-label="Sections in this phase"></nav></div><iframe id="viewer" title="BrainGain client report" sandbox="allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-downloads"></iframe><script>
const CONFIG={"salt":"rUtLHU2MMT6HmF4pH37pZg==","iv":"hSRoP1aKWt+TQSZO","iterations":600000,"hash":"b91cdffbae37683c84b8dc5b1e5e68ed1c46e0910db105084e7e373d25b27f84"},un=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));let bundle,urls={},current;
const viewer=document.getElementById('viewer');
function resolve(file,ref){const u=new URL(ref,'https://bundle.invalid/'+file);return {path:decodeURI(u.pathname.slice(1)),hash:u.hash};}
const phases=[{name:'Objective',items:[['Overview','REVIEW.html','overview']]},{name:'Research',items:[['Current listing','REVIEW.html','baseline'],['PDP competitors','REVIEW.html','competitors'],['A+ competitors','REVIEW.html','aplus'],['Customer insights','REVIEW.html','voc'],['Search demand','REVIEW.html','search-intent'],['Press proof','REVIEW.html','press']]},{name:'Creative plan',items:[['Thesis & approach','REVIEW.html','next'],['Brand direction','REVIEW.html','website'],['24kg mockups','ed004/CREATIVE-X-24KG.html','canvas'],['40kg mockups','ed004/CREATIVE-X-40KG.html','canvas']]},{name:'Approval',items:[['Your decisions','REVIEW.html','approval'],['Next steps','REVIEW.html','gaps']]}];
let activePhase=0,activeItem=0;
function routeFor(file,hash){let id=hash.replace('#','');if(['client-approval','approval'].includes(id))id='approval';if(['creative-thesis','creative-delta','start-here'].includes(id))id='next';for(let p=0;p<phases.length;p++)for(let i=0;i<phases[p].items.length;i++){const row=phases[p].items[i];if(row[1]===file&&(row[2]===id||(file!=='REVIEW.html'))){return [p,i];}}return file==='REVIEW.html'?[0,0]:[1,0];}
function renderFlow(file,hash){[activePhase,activeItem]=routeFor(file,hash);const nav=document.getElementById('phase-nav'),sub=document.getElementById('phase-subnav');nav.replaceChildren();sub.replaceChildren();phases.forEach((p,i)=>{const b=document.createElement('button');b.textContent=`${i+1}. ${p.name}`;b.setAttribute('aria-current',i===activePhase?'step':'false');b.onclick=()=>{const r=p.items[0];show(r[1],'#'+r[2]);};nav.append(b);});phases[activePhase].items.forEach((r,i)=>{const b=document.createElement('button');b.textContent=r[0];b.setAttribute('aria-current',i===activeItem?'page':'false');b.onclick=()=>show(r[1],'#'+r[2]);sub.append(b);});}
function prepareFlow(doc,file,hash){
 if(file==='REVIEW.html'){
  doc.querySelector('.report-index')?.remove();doc.querySelector('.contents-grid')?.remove();doc.querySelector('.report-header')?.remove();
  const plan=doc.getElementById('next'),intro=doc.getElementById('start-here');if(intro&&plan){intro.querySelector('h2').textContent='Serious training that fits real life.';plan.insertBefore(intro,plan.firstChild);}
  const approval=doc.createElement('section');approval.className='chapter';approval.id='approval';const heading=doc.getElementById('client-approval');if(heading){let el=heading;while(el){const next=el.nextSibling;approval.append(el);el=next;}doc.querySelector('.report-main').append(approval);}
  const [p,i]=routeFor(file,hash),id=phases[p].items[i][2];doc.querySelectorAll('.chapter').forEach(el=>el.hidden=el.id!==id);doc.querySelector('.report-footer')?.remove();
  if(id==='overview'){const title=doc.querySelector('#overview h1');if(title)title.innerHTML='BrainGain creative review';const div=doc.createElement('div');div.className='flow-guide';div.innerHTML='<h2>One clear route to a decision.</h2><p><strong>The objective:</strong> make the 24kg and 40kg pairs easier to understand and choose, while retaining what works in the current listing.</p><ol><li><strong>Research:</strong> inspect the current listing, competition and shopper evidence.</li><li><strong>Creative plan:</strong> review the thesis, visual direction and both model-specific mockup boards.</li><li><strong>Approval:</strong> send three explicit decisions and any changes.</li></ol><p>You are reviewing concepts—not final copy or finished artwork. Nothing is automatically approved.</p><a class="button" href="#baseline">Begin with the research →</a> <a class="button" href="#next">Go directly to the creative plan →</a>';title?.after(div);}
 }
 const style=doc.createElement('style');style.textContent='.report-main{margin:0 auto!important;padding:0 32px 40px!important;max-width:1400px}.chapter{padding:28px 0!important}.chapter[hidden]{display:none!important}.chapter h1{font-size:clamp(32px,4vw,48px);margin:12px 0}.chapter .section-kicker{margin-bottom:12px}.client-start{margin-top:0}.report-index{display:none!important}.flow-guide{padding:22px;background:white;border:1px solid #d6d5de;border-radius:12px}.flow-guide h2{font-size:26px}html{scroll-behavior:auto!important}.phase-next{display:flex;justify-content:space-between;gap:16px;padding:26px 0;margin-top:32px;border-top:1px solid #d6d5de}.phase-next a{padding:12px 18px;background:#4d389b;color:white;border-radius:6px;text-decoration:none}body{overflow-x:hidden}@media(max-width:700px){.report-main{padding:0 16px 30px!important}.phase-next{flex-wrap:wrap}}';doc.head.append(style);
 const [p,i]=routeFor(file,hash),flat=phases.flatMap(p=>p.items),r=phases[p].items[i],index=flat.indexOf(r),footer=doc.createElement('nav');footer.className='phase-next';footer.setAttribute('aria-label','Continue your review');for(const [label,target]of [['← Back',flat[index-1]],['Next →',flat[index+1]]])if(target){const a=doc.createElement('a');a.href=target[1]===file?'#'+target[2]:(file.startsWith('ed004/')&&target[1]==='REVIEW.html'?'../REVIEW.html':file.startsWith('ed004/')?target[1].replace('ed004/',''):target[1])+'#'+target[2];a.textContent=label+' '+target[0];footer.append(a);}doc.querySelector('main')?.append(footer);
}

function show(file,hash=''){current=file;renderFlow(file,hash);let doc=new DOMParser().parseFromString(bundle.pages[file],'text/html');prepareFlow(doc,file,hash);
 for(const el of doc.querySelectorAll('[src],[href]'))for(const attr of ['src','href']){const ref=el.getAttribute(attr);if(!ref||/^(https?:|mailto:|data:|#)/.test(ref))continue;const target=resolve(file,ref);if(bundle.pages[target.path]){el.removeAttribute('target');el.setAttribute('href','#');el.dataset.reportPage=target.path;el.dataset.reportHash=target.hash;}else if(urls[target.path])el.setAttribute(attr,urls[target.path]+target.hash);else throw Error('Missing packaged resource '+target.path);}
 viewer.onload=()=>{const d=viewer.contentDocument;d.addEventListener('click',e=>{const a=e.target.closest('a');if(!a)return;if(a.dataset.reportPage){e.preventDefault();show(a.dataset.reportPage,a.dataset.reportHash);return;}const href=a.getAttribute('href');if(href&&href.startsWith('#')){e.preventDefault();const id=decodeURIComponent(href.slice(1));if(id){const target=d.getElementById(id),section=target?.closest('.chapter');if(section?.hidden||id==='creative-thesis'||id==='client-approval'){show('REVIEW.html','#'+id);return;}target?.scrollIntoView({behavior:'auto',block:'start'});}else viewer.contentWindow.scrollTo({top:0,behavior:'smooth'});}});if(hash&&!['overview','next','approval','canvas'].includes(hash.slice(1)))d.getElementById(hash.slice(1))?.scrollIntoView();};
 viewer.srcdoc='<!doctype html>'+doc.documentElement.outerHTML;document.getElementById('location').textContent=file.includes('24KG')?'24kg concepts':file.includes('40KG')?'40kg concepts':file==='REVIEW.html'?'Creative research':'Supporting evidence';
}
document.getElementById('unlock').addEventListener('submit',async e=>{e.preventDefault();const error=document.getElementById('error'),button=document.getElementById('submit');button.disabled=true;error.textContent='Opening encrypted report and image library…';try{
 const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('password').value),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:un(CONFIG.salt),iterations:CONFIG.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
 const response=await fetch('report.bin?v='+CONFIG.hash);if(!response.ok)throw Error('Download failed');const encrypted=await response.arrayBuffer();const packed=await crypto.subtle.decrypt({name:'AES-GCM',iv:un(CONFIG.iv)},key,encrypted);
 const text=await new Response(new Blob([packed]).stream().pipeThrough(new DecompressionStream('gzip'))).text();bundle=JSON.parse(text);
 for(const [file,asset]of Object.entries(bundle.assets))urls[file]=URL.createObjectURL(new Blob([un(asset.data)],{type:asset.type}));
 document.getElementById('password').value='';document.getElementById('gate').hidden=true;document.getElementById('bar').style.display='flex';viewer.style.display='block';document.body.classList.add('unlocked');document.getElementById('flow').style.display='block';show('REVIEW.html');
 }catch(err){error.textContent=err.name==='OperationError'?'Incorrect password. Please try again.':'Unable to open. Check your connection and use a current browser.';button.disabled=false;}});
document.getElementById('home').onclick=()=>show('REVIEW.html');document.getElementById('lock').onclick=()=>location.reload();
</script></body></html>
