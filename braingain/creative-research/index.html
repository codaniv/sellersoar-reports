<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>BrainGain Creative Research | SellerSoar</title><style>body{margin:0;background:#f6f5fc;color:#191919;font:16px/1.5 Arial}#gate{max-width:420px;margin:12vh auto;padding:32px;background:white;border:1px solid #ddd7ea;border-radius:14px}h1{font-size:27px}label,input,button{display:block;width:100%;box-sizing:border-box}input,button{padding:13px;margin-top:10px;font:inherit;border-radius:7px;border:1px solid #d6d5de}button{background:#4d389b;color:white;cursor:pointer}#error{color:#923731}#bar{display:none;padding:8px 16px;gap:14px;align-items:center;background:white;border-bottom:1px solid #ddd}#bar button{width:auto;margin:0;padding:6px 14px;font-size:14px}iframe{display:none;width:100%;height:calc(100dvh - 53px);border:0}</style></head><body><main id="gate"><small>SELLERSOAR · CLIENT REPORTS</small><h1>BrainGain<br>Creative research</h1><p>Private client presentation. Enter the password supplied for this creative report.</p><form id="unlock"><label for="password">Password</label><input id="password" type="password" required autocomplete="current-password"><button id="submit">Open report</button><p id="error" role="status"></p></form></main><nav id="bar"><button id="home">Research report</button><button id="lock">Lock report</button><span id="location"></span></nav><iframe id="viewer" title="BrainGain client report" sandbox="allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-downloads"></iframe><script>
const CONFIG={"salt":"Fdh6raREE1tt8byHAI+SKQ==","iv":"PezyRBvE9ey12tnJ","iterations":600000,"hash":"8808865ae4b985ae7344abe7249088d6c21db9b6d1718d37fe9fdcd71ee33123"},un=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));let bundle,urls={},current;
const viewer=document.getElementById('viewer');
function resolve(file,ref){const u=new URL(ref,'https://bundle.invalid/'+file);return {path:decodeURI(u.pathname.slice(1)),hash:u.hash};}
function show(file,hash=''){current=file;let doc=new DOMParser().parseFromString(bundle.pages[file],'text/html');
 for(const el of doc.querySelectorAll('[src],[href]'))for(const attr of ['src','href']){const ref=el.getAttribute(attr);if(!ref||/^(https?:|mailto:|data:|#)/.test(ref))continue;const target=resolve(file,ref);if(bundle.pages[target.path]){el.removeAttribute('target');el.setAttribute('href','#');el.dataset.reportPage=target.path;el.dataset.reportHash=target.hash;}else if(urls[target.path])el.setAttribute(attr,urls[target.path]+target.hash);else throw Error('Missing packaged resource '+target.path);}
 viewer.onload=()=>{const d=viewer.contentDocument;d.addEventListener('click',e=>{const a=e.target.closest('a[data-report-page]');if(a){e.preventDefault();show(a.dataset.reportPage,a.dataset.reportHash);}});if(hash)d.getElementById(hash.slice(1))?.scrollIntoView();};
 viewer.srcdoc='<!doctype html>'+doc.documentElement.outerHTML;document.getElementById('location').textContent=file.includes('24KG')?'24kg concepts':file.includes('40KG')?'40kg concepts':file==='REVIEW.html'?'Creative research':'Supporting evidence';
}
document.getElementById('unlock').addEventListener('submit',async e=>{e.preventDefault();const error=document.getElementById('error'),button=document.getElementById('submit');button.disabled=true;error.textContent='Opening encrypted report and image library…';try{
 const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('password').value),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:un(CONFIG.salt),iterations:CONFIG.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
 const response=await fetch('report.bin?v='+CONFIG.hash);if(!response.ok)throw Error('Download failed');const encrypted=await response.arrayBuffer();const packed=await crypto.subtle.decrypt({name:'AES-GCM',iv:un(CONFIG.iv)},key,encrypted);
 const text=await new Response(new Blob([packed]).stream().pipeThrough(new DecompressionStream('gzip'))).text();bundle=JSON.parse(text);
 for(const [file,asset]of Object.entries(bundle.assets))urls[file]=URL.createObjectURL(new Blob([un(asset.data)],{type:asset.type}));
 document.getElementById('password').value='';document.getElementById('gate').hidden=true;document.getElementById('bar').style.display='flex';viewer.style.display='block';show('REVIEW.html');
 }catch(err){error.textContent=err.name==='OperationError'?'Incorrect password. Please try again.':'Unable to open. Check your connection and use a current browser.';button.disabled=false;}});
document.getElementById('home').onclick=()=>show('REVIEW.html');document.getElementById('lock').onclick=()=>location.reload();
</script></body></html>
